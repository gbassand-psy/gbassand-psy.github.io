fr:
  role: "Psychologue FSP, fondateur de ENSŌ Psychologie"
  tagline: "Chaque accompagnement commence par une rencontre."
  bio: "Mon approche s'inspire de l'humanisme existentialiste, avec un intérêt marqué pour la question de la finitude et la place de l'humain dans le monde. Orientée vers les ressources et les forces, j'accueille adultes, adolescents et familles à Lausanne et en ligne, dans le cadre du conseil et du soutien psychologique."
  link_label: "En savoir plus sur mon approche →"
  link_url: "/a-propos/"

en:
  role: "Psychologist (FSP), founder of ENSŌ Psychologie"
  tagline: "Every journey begins with a genuine meeting."
  bio: "My approach draws on humanistic-existentialism, with a particular interest in the question of the reality of human limits and our place in the world. Strengths-focused, I welcome adults, adolescents and families in Lausanne and online, within a framework of psychological counselling and support."
  link_label: "Learn more about my approach →"
  link_url: "/en/about/"
